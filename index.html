<title>ファンメモ</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ファンメモ">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky header, fixed bottom nav with raised center "入力" button. Light-only by design (sky + white). */
:root{
  --sky:#2fa4dc; --sky-deep:#1677b0; --sky-soft:#e6f5fc; --sky-line:#cbe8f6;
  --bg:#f7fbfe; --card:#ffffff; --ink:#1d3240; --mute:#6b8494; --warn:#c2541b; --warn-soft:#fdf0e8; --ok:#1a7f6b; --ok-soft:#dcf3ee;
  --st-cheki-bg:#d8effa; --st-cheki:#1677b0; --st-satsuei-bg:#e8e6fb; --st-satsuei:#5146b0;
  --st-dcheki-bg:#d6f0f4;--st-dcheki:#0f6f80;--st-dvisit-bg:#f1effb;--st-dvisit:#6d64a8;--st-shame-bg:#dcf3ee; --st-shame:#1a7f6b; --st-bira-bg:#eef2f5; --st-bira:#5f7584;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --altfs:clamp(11px,calc((min(100vw,560px) - 112px) / 22),16px);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background-color:var(--card)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sky-deep);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--sky-line)}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
h1{font-family:var(--display);font-size:20px;margin:0;color:var(--sky-deep);flex:1;text-wrap:balance}
.demo.off{background:var(--warn-soft);color:var(--warn)}
.login{display:flex;flex-direction:column;gap:12px;margin-top:8vh}
.login h2{font-family:var(--display);font-size:24px;color:var(--sky-deep);margin:0;text-align:center}
.login .err{color:var(--warn);font-size:13px}
.demo{font-size:11px;background:var(--sky-soft);color:var(--sky-deep);padding:2px 8px;border-radius:99px;letter-spacing:.04em}
main .wrap{padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}

/* common parts */
.card{background:var(--card);border:1px solid var(--sky-line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-family:var(--display);font-size:16px;margin:0;color:var(--sky-deep)}
.sec-h small{color:var(--mute);font-size:12px}
.lbl{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.06em}
.hint{font-size:12px;color:var(--mute)}
.link{border:0;background:none;color:var(--sky-deep);font-size:12px;padding:0;font-weight:700}
.field{width:100%;box-sizing:border-box;border:1.5px solid var(--sky-line);border-radius:10px;padding:10px 12px;background:var(--card)}
.field:focus{border-color:var(--sky);outline:none}
.field.sm{padding:7px 10px}
.search{width:100%;box-sizing:border-box;border:1.5px solid var(--sky-line);background:var(--card);border-radius:12px;padding:11px 14px}
.search:focus{border-color:var(--sky);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--sky-line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px}
.chips.t4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.chips.t4 .chip{padding:5px 2px;font-size:12px;white-space:nowrap}
.chip.on{background:var(--sky);border-color:var(--sky);color:#fff}
.tag{display:inline-block;font-size:12px;background:var(--sky-soft);color:var(--sky-deep);border-radius:6px;padding:1px 7px}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.st-cheki{background:var(--st-cheki-bg);color:var(--st-cheki)}
.st-kosatsu{background:var(--st-satsuei-bg);color:var(--st-satsuei)}
.st-dcheki{background:var(--st-dcheki-bg);color:var(--st-dcheki)}
.st-dvisit{background:var(--st-dvisit-bg);color:var(--st-dvisit)}
.st-shame{background:var(--st-shame-bg);color:var(--st-shame)}
.st-bira{background:var(--st-bira-bg);color:var(--st-bira)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.primary{border:0;background:var(--sky-deep);color:#fff;border-radius:12px;padding:12px;font-weight:700;font-size:16px}
.primary:disabled{background:var(--sky-line)}
.ghost{border:1.5px solid var(--sky-line);background:var(--card);border-radius:10px;padding:9px 12px}
.danger{border:0;background:var(--warn);color:#fff;border-radius:10px;padding:9px 12px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline .field{flex:1;min-width:0}
.x{border:0;background:none;color:var(--mute);font-size:18px;line-height:1;padding:2px 6px}
.newbtn{border:1.5px dashed var(--sky);background:var(--sky-soft);color:var(--sky-deep);border-radius:10px;padding:10px;font-weight:700}

/* list */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters label{display:flex;flex-direction:column;gap:4px;min-width:0}
.sortbar{display:flex;gap:8px}
.sel,.sortbar select{flex:1;min-width:0;border:1.5px solid var(--sky-line);border-radius:10px;padding:8px 10px;background:var(--card)}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--sky-line);border-radius:14px;overflow:hidden}
.row{cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;align-items:center;gap:2px 12px;text-align:left;border:0;background:none;padding:12px 14px;border-top:1px solid var(--sky-line)}
.row:first-child{border-top:0}
.regt{grid-row:1/3;grid-column:4;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--sky-line);font-size:10px;font-weight:700;padding:4px 2px}
.regt svg{width:22px;height:22px}
.regt.on{color:#e3a514}
.regt.on svg{fill:currentColor}
.sortbar .regbtn{white-space:nowrap;padding:9px 10px}
.sortbar .regbtn.on{background:var(--sky-soft);border-color:var(--sky);color:var(--sky-deep);font-weight:700}
.sortbar #sortdir{white-space:nowrap;padding:9px 10px}
.row:active{background:var(--sky-soft)}
.row .nm{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .ft{grid-column:2/4;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);min-width:0}
.row .ft .memo{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:12px;color:var(--sky-deep);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
.av{grid-row:span 2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;overflow:hidden;flex:none}
.av.sm{width:30px;height:30px;font-size:13px}
.av img{width:100%;height:100%;object-fit:cover}

/* input */
.frow{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;align-items:center}
.frow>.lbl{white-space:nowrap}
.frow.top{align-items:start}
.frow.top>.lbl{padding-top:6px}
.frow.top.flat>.lbl{padding-top:2px}
.fcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.seg{display:flex;border:1.5px solid var(--sky-line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-left:1.5px solid var(--sky-line);background:var(--card);padding:7px 4px;font-size:13px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg.ev{display:grid;grid-template-columns:1fr 1fr}
.seg.ev button{border-left:0;border-top:1.5px solid var(--sky-line)}
.seg.ev button:nth-child(-n+2){border-top:0}
.seg.ev button:nth-child(even){border-left:1.5px solid var(--sky-line)}
.seg button.on{background:var(--sky);color:#fff;font-weight:700}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--sky-line);background:var(--card);font-size:20px;line-height:1;flex:none}
.stepper input{background:var(--card);color:var(--ink);-webkit-text-fill-color:var(--ink);width:64px;text-align:center;border:1.5px solid var(--sky-line);border-radius:10px;padding:7px 4px;font-variant-numeric:tabular-nums}
.stepper span{color:var(--mute);font-size:13px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:4;background:var(--bg);padding-block:4px}
.stp{display:flex;flex-direction:column;align-items:center;gap:0;border:1.5px solid var(--sky-line);background:var(--card);border-radius:12px;padding:6px 4px;position:relative}
.stp .no{position:absolute;left:8px;top:7px;width:18px;height:18px;border-radius:50%;background:var(--sky-soft);color:var(--sky-deep);font-size:11px;font-weight:700;display:grid;place-items:center}
.stp .tt{font-weight:700;font-size:14px}
.stp small{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.stp small.ok{color:var(--ok);font-weight:700}
.stp small.ng{color:var(--warn);font-weight:700}
.stp.on{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff}
.stp.on .no{background:#fff}
.stp.on small,.stp.on small.ok,.stp.on small.ng{color:#fff}
.stp:disabled{opacity:.45}
.sumbar{display:flex;align-items:center;gap:8px;border:0;background:var(--sky-soft);color:var(--sky-deep);border-radius:10px;padding:9px 12px;text-align:left;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.sumbar .sv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:500}
.sumbar .pen{font-size:15px}
.tagtoggle{display:flex;align-items:center;gap:8px;border:1px dashed var(--sky-line);background:none;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--sky-deep);text-align:left}
.tagtoggle .tg-sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.stabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.stabs button{flex:none;border:1.5px solid var(--sky-line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:13px}
.stabs button.on{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff;font-weight:700}
.stabs .add{border-style:dashed;color:var(--sky-deep)}
.bal{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:10px;padding:8px 12px;font-size:13px;font-variant-numeric:tabular-nums;background:var(--sky-soft);color:var(--sky-deep)}
.bal.ng{background:var(--warn-soft);color:var(--warn)}
.bal.ok{background:var(--ok-soft);color:var(--ok)}
.bal b{font-size:15px}
.sugg{display:flex;flex-direction:column;border:1px solid var(--sky-line);border-radius:10px;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;border-top:1px solid var(--sky-line);background:var(--card);padding:9px 12px}
.sugg button:first-child{border-top:0}
.sugg small{color:var(--mute);font-variant-numeric:tabular-nums}
.editor{border:1.5px solid var(--sky);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fbfeff}
.editor .who{display:flex;align-items:center;gap:8px}
.editor .who b{flex:1;font-size:16px;min-width:0}
.ents{display:flex;flex-direction:column;border-top:1px solid var(--sky-line)}
.ent{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--sky-line);padding:8px 0}
.ent .nmb{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;align-items:center;gap:8px}
.ent .nmb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .k{font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.vlist{display:flex;flex-direction:column;max-height:240px;overflow-y:auto;border:1px solid var(--sky-line);border-radius:10px}
.vlist button{text-align:left;border:0;border-top:1px solid var(--sky-line);background:var(--card);padding:10px 12px;display:flex;justify-content:space-between;gap:8px}
.vlist button:first-child{border-top:0}
.vlist button.on{background:var(--sky-soft);color:var(--sky-deep);font-weight:700}

/* thanks */
.grp{display:flex;flex-direction:column;gap:6px}
.grp-h{font-size:13px;font-weight:700;color:var(--sky-deep);display:flex;justify-content:space-between}
.tcard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:1px solid var(--sky-line);border-radius:12px;padding:10px 12px}
.tc-h{display:flex;align-items:center;gap:8px;width:100%;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.sorting .alt{display:none}
.sorting .tcard{padding-block:8px}
.tcard.lifted{position:relative;z-index:3;background:var(--card);border-color:var(--sky);box-shadow:0 10px 24px rgba(22,119,176,.28);transform:scale(1.03)}
@media (prefers-reduced-motion:no-preference){.tcard{transition:transform .12s,box-shadow .12s}}
.tc-h b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-h small{flex:1;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-h .state{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.acc{border:1px solid var(--sky-line);border-radius:12px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:10px;border:0;background:var(--card);padding:9px 12px;text-align:left}
.acc-h .t{flex:1;min-width:0;display:flex;flex-direction:column}
.acc-h .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-h .t small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.acc-h .state{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.state.todo{background:var(--warn-soft);color:var(--warn)}
.state.done{background:var(--ok-soft);color:var(--ok)}
.acc-h .chev{color:var(--mute);transition:transform .15s}
.acc.open .chev{transform:rotate(90deg)}
.acc-b{padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.alt{font-family:var(--body);font-size:var(--altfs);line-height:1.8;width:calc(22em + 1px);height:calc(1.8em * 6);overflow-y:auto;box-sizing:content-box;padding:6px 8px;border:1.5px solid var(--sky-line);border-radius:8px;resize:none;word-break:break-all;line-break:anywhere;overflow-wrap:anywhere;
  background-color:var(--card);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.8em - 1px),var(--sky-line) calc(1.8em - 1px),var(--sky-line) 1.8em);background-attachment:local;background-position:0 6px}
.alt:focus{border-color:var(--sky);outline:none}
.altbar{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.altbar .sp{flex:1}
.altbar .altcount.over{color:var(--warn);font-weight:700}
.crow{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.crow .cbtn{min-width:9.5em;text-align:center;font-weight:700;color:var(--sky-deep)}
.crow .cbtn:disabled{color:var(--mute);opacity:.6}
.cmeta{font-size:13px;color:var(--mute)}
.crow.multi{flex-direction:column;align-items:stretch;gap:6px;background:var(--bg);border-radius:10px;padding:8px 10px}
.crow-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.crow-b{display:flex;flex-wrap:wrap;gap:6px}
.crow-b .cbtn{display:flex;flex-direction:column;align-items:center;min-width:0;flex:1}
.crow-b small{font-size:11px;color:var(--mute);font-weight:400}
.copyparts{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:10px}
.copyparts .cpr{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.note{white-space:pre-wrap}

/* detail */
.ibtn{width:40px;height:40px;display:grid;place-items:center;border:1.5px solid var(--sky-line);background:var(--card);border-radius:10px;color:var(--sky-deep);padding:0}
.ibtn.hd{width:36px;height:36px;border:0;color:var(--mute)}
.ibtn.hd svg{width:22px;height:22px}
.ibtn.hd.on{color:var(--sky-deep);background:var(--sky-soft)}
.ibtn.del{color:var(--warn)}
.evcard{background:var(--card);border:1px solid var(--sky-line);border-radius:14px;overflow:hidden}
.evh{width:100%;display:flex;align-items:baseline;gap:10px;border:0;border-bottom:1px solid var(--sky-line);background:var(--sky-soft);padding:10px 14px;text-align:left}
.evh .evd{font-family:var(--display);font-weight:700;font-size:16px;color:var(--sky-deep);white-space:nowrap;font-variant-numeric:tabular-nums}
.evh .evt-t{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evh small,.evs-h small{font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
.evh .chev{color:var(--sky-deep)}
.evs{padding:6px 14px 10px}
.evs+.evs{border-top:1px dashed var(--sky-line)}
.evs-h{font-size:13px;font-weight:700;padding:4px 0 2px}
.evs-h b{color:var(--sky-deep);margin-right:6px}
.evp{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:4px 0;font-size:15px}
.evp .dot{width:5px;height:5px;border-radius:50%;background:var(--sky);flex:none}
.evp .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evp .v{color:var(--mute);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.evtitle{font-family:var(--display);font-size:20px;margin:0;color:var(--ink)}
.frow.flat{align-items:baseline}
.tview{border:1px solid var(--sky-line);border-radius:12px}
.tview summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none}
.tview summary::-webkit-details-marker{display:none}
.tview .t{flex:1;min-width:0;display:flex;flex-direction:column}
.tview .t small{color:var(--mute);font-size:12px}
.tview .state{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.tview p{margin:0;padding:0 12px 12px;white-space:pre-wrap;font-size:14px}
.back{border:0;background:none;color:var(--sky-deep);font-weight:700;padding:4px 0}
.prof{display:flex;gap:14px;align-items:center}
.av.face{width:64px;height:64px;font-size:26px}
.prof h2{font-family:var(--display);margin:0;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sky-soft);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px;color:var(--sky-deep);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mute)}

<script>
// ===== 定義 =====
// 区分＝顧客ステータス（その人がその公演で何をしたか）
// thanks: お礼文の対象か / count: 枚数・部数を入れるか / rank: 同じ日に複数あるときの優先度
const KINDS = {
  cheki:   { label: 'チェキ',     status: '特典会チェキ',   unit: '枚', count: true,  thanks: true,  rank: 3, cls: 'cheki' },
  kosatsu: { label: 'コサツ',     status: 'コサツ',         unit: '部', count: true,  thanks: true,  rank: 3, cls: 'kosatsu' },
  dcheki:  { label: 'チェキ',     status: 'ダイサツチェキ', unit: '枚', count: true,  thanks: true,  rank: 3, cls: 'dcheki' },
  shame:   { label: '新規写メ',   status: '新規写メ',       count: false, thanks: false, rank: 2, cls: 'shame' },
  dvisit:  { label: '参加のみ',   status: 'ダイサツ参加',   count: false, thanks: false, rank: 2, cls: 'dvisit' },
  bira:    { label: 'ビラのみ',   status: '特典会ビラ',     count: false, thanks: false, rank: 1, cls: 'bira' },
  sbira:   { label: 'ビラ',       status: '街頭ビラ',       count: false, thanks: false, rank: 1, cls: 'bira' },
};
const STATUS_ORDER = ['cheki', 'kosatsu', 'dcheki', 'shame', 'bira', 'dvisit', 'sbira'];
// イベント種別
const EVENTS = {
  tokuten:  { label: '特典会',               short: '特典会',   kinds: ['cheki', 'shame', 'bira'], total: true,  thanks: true,  place: '会場' },
  kosatsu:  { label: 'コサツ',               short: 'コサツ',   kinds: ['kosatsu'],                total: false, thanks: true,  place: '会場' },
  daisatsu: { label: 'ダイサツ・セッション', short: 'ダイサツ', kinds: ['dcheki', 'dvisit'],       total: true,  thanks: true,  place: '会場' },
  street:   { label: '街頭ビラ配り',         short: '街頭ビラ', kinds: ['sbira'],                  total: false, thanks: false, place: '場所' },
};
const CHEKI_KINDS = ['cheki', 'dcheki'];
const ICON_PEN = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
const ICON_STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z"/></svg>';
const TAGS = ['若い', '高齢', 'メガネ', 'ふくよか', '薄毛', '帽子', 'マスク'];

// ===== データ層（Firebase：ログインした本人のデータだけを読み書き） =====
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// 朝6時までは前日扱い
function liveDate(now = new Date()) { const d = new Date(now); if (d.getHours() < 6) d.setDate(d.getDate() - 1); return ymd(d); }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); }

const emptyDb = () => ({ sample: false, customers: [], sessions: [], entries: [], thanks: {}, orders: {}, venues: [], settings: {} });
let db = emptyDb();

// --- Firestore 同期 ---
// 画面側は今までどおり db を書き換えて save() を呼ぶだけ。
// save() は少し待ってから、前回送った内容との差分だけを Firestore に書き込む（オフライン時は端末に保存され、通信が戻ると自動送信）。
let FB = null, user = null, unsubs = [], ready = false, flushTimer = null, pendingRender = false, firstSnaps = new Set();
const COLS = ['customers', 'sessions', 'entries', 'thanks', 'orders', 'meta'];
const synced = Object.fromEntries(COLS.map(c => [c, new Map()]));
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(key => [key, x[key]])) : x);
const clean = v => JSON.parse(JSON.stringify(v));
function toDocs() {
  return {
    customers: new Map(db.customers.map(x => [x.id, x])),
    sessions: new Map(db.sessions.map(x => [x.id, x])),
    entries: new Map(db.entries.map(x => [x.id, x])),
    thanks: new Map(Object.entries(db.thanks).map(([k, text]) => { const [date, cid] = k.split('|'); return [`${date}_${cid}`, { date, cid, text }]; })),
    orders: new Map(Object.entries(db.orders || {}).map(([date, cids]) => [date, { date, cids }])),
    meta: new Map([['app', { venues: db.venues, settings: db.settings }]]),
  };
}
function save() { if (!user || !ready) return; clearTimeout(flushTimer); flushTimer = setTimeout(flush, 800); }
function flush() {
  clearTimeout(flushTimer); flushTimer = null;
  if (!user || !ready) return;
  const cur = toDocs(), ops = [];
  for (const col of COLS) {
    const m = cur[col], sm = synced[col];
    m.forEach((v, id) => { const j = stable(v); if (sm.get(id) !== j) { ops.push(['set', col, id, clean(v)]); sm.set(id, j); } });
    [...sm.keys()].forEach(id => { if (!m.has(id)) { ops.push(['del', col, id]); sm.delete(id); } });
  }
  for (let i = 0; i < ops.length; i += 400) FB.commit(user.uid, ops.slice(i, i + 400)).catch(err => { console.error(err); toast('保存に失敗しました。通信を確認してください'); });
}
// アプリを閉じる・切り替えるときは待たずに保存
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);

function applyRemote(col, id, data) {
  if (col === 'meta') { db.venues = data.venues || []; db.settings = data.settings || {}; return; }
  if (col === 'thanks') { db.thanks[`${data.date}|${data.cid}`] = data.text || ''; return; }
  if (col === 'orders') { db.orders[data.date] = data.cids || []; return; }
  const arr = db[col], i = arr.findIndex(x => x.id === id);
  if (i >= 0) arr[i] = data; else arr.push(data);
}
function removeRemote(col, id) {
  if (col === 'meta') return;
  if (col === 'thanks') { const [date, cid] = id.split('_'); delete db.thanks[`${date}|${cid}`]; return; }
  if (col === 'orders') { delete db.orders[id]; return; }
  db[col] = db[col].filter(x => x.id !== id);
}
function onSnap(col, snap) {
  let changed = false;
  snap.docChanges().forEach(ch => {
    const id = ch.doc.id;
    if (ch.type === 'removed') { if (synced[col].has(id)) { synced[col].delete(id); removeRemote(col, id); changed = true; } return; }
    const data = ch.doc.data(), j = stable(data);
    if (synced[col].get(id) === j) return; // 自分が書いた内容の折り返し
    synced[col].set(id, j); applyRemote(col, id, ['meta', 'thanks', 'orders'].includes(col) ? data : { ...data, id }); changed = true;
  });
  if (!ready) { firstSnaps.add(col); if (firstSnaps.size === COLS.length) { ready = true; render(); } return; }
  if (changed) scheduleRender();
}
// 他の端末からの変更：入力中なら、入力欄を離れてから画面を更新する
function scheduleRender() {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) { pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) { pendingRender = false; render(); } }, 0));

function startSync() {
  ready = false; firstSnaps = new Set(); db = emptyDb(); COLS.forEach(c => synced[c].clear());
  unsubs = COLS.map(col => FB.listen(user.uid, col, snap => onSnap(col, snap), err => { console.error(err); showFatal('データを読み込めませんでした。Firestoreのルール設定を確認してください。'); }));
}
function stopSync() { flush(); unsubs.forEach(u => u()); unsubs = []; ready = false; db = emptyDb(); COLS.forEach(c => synced[c].clear()); }

// ネット接続の表示
function updateNet() { document.getElementById('net').hidden = navigator.onLine; }
window.addEventListener('online', updateNet); window.addEventListener('offline', updateNet);

// ===== ユーティリティ =====
// ひらがな・カタカナ・全角半角・大文字小文字の違いを吸収
const norm = s => (s || '').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)).replace(/\s+/g, '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const fmt = d => { const [, m, dd] = d.split('-'); return `${+m}/${+dd}`; };
const WD = '日月火水木金土';
const fmtW = d => { const [y, m, dd] = d.split('-').map(Number); return `${m}/${dd}（${WD[new Date(y, m - 1, dd).getDay()]}）`; };
const cust = id => db.customers.find(c => c.id === id);
const sess = id => db.sessions.find(s => s.id === id);
const daySessions = date => db.sessions.filter(s => s.date === date).sort((a, b) => a.order - b.order);
const kindText = e => KINDS[e.kind].label + (KINDS[e.kind].count ? ` ${e.count}${KINDS[e.kind].unit}` : '');
const stBadge = st => st ? `<span class="st st-${KINDS[st].cls}">${KINDS[st].status}</span>` : '';

// 公演の呼び名：同じイベントが2公演なら「昼公演/夜公演」、それ以外は「1部/2部…」
function sessLabels(date) {
  const ss = daySessions(date), m = {};
  const th = ss.filter(s => EVENTS[s.event].thanks);
  ss.forEach(s => m[s.id] = EVENTS[s.event].thanks ? '' : EVENTS[s.event].label);
  if (th.length >= 2) th.forEach((s, i) => m[s.id] = `${i + 1}部`);
  return m;
}

// 顧客ごとの集計
function stats(cid) {
  const es = db.entries.filter(e => e.cid === cid).map(e => ({ ...e, s: sess(e.sid) })).filter(e => e.s);
  const dates = [...new Set(es.map(e => e.s.date))].sort().reverse();
  const visitDates = new Set(es.filter(e => e.s.event !== 'street').map(e => e.s.date));
  let last = null, status = null;
  if (dates.length) {
    const ld = es.filter(e => e.s.date === dates[0]).sort((a, b) => b.s.order - a.s.order);
    last = { date: dates[0], venue: ld[0].s.venue, event: ld[0].s.event, at: Math.max(...ld.map(e => e.at)) };
    status = ld.map(e => e.kind).sort((a, b) => KINDS[b].rank - KINDS[a].rank || STATUS_ORDER.indexOf(a) - STATUS_ORDER.indexOf(b))[0];
  }
  const firstAt = dates.length ? Math.min(...es.filter(e => e.s.date === dates[dates.length - 1]).map(e => e.at)) : 0;
  return {
    es, dates, last, status, count: visitDates.size,
    first: dates.length ? { date: dates[dates.length - 1], at: firstAt } : null,
    cheki: es.filter(e => CHEKI_KINDS.includes(e.kind)).reduce((n, e) => n + e.count, 0),
  };
}
function venueStats() {
  const m = new Map(db.venues.map(n => [n, { name: n, count: 0, last: '' }]));
  db.sessions.forEach(s => {
    if (!s.venue) return;
    if (!m.has(s.venue)) m.set(s.venue, { name: s.venue, count: 0, last: '' });
    const v = m.get(s.venue); v.count++; if (s.date > v.last) v.last = s.date;
  });
  return [...m.values()];
}
// ALT用の行数（全角22文字＝1行、半角は0.5文字で計算）
const ALT_COLS = 22;
function altLines(t) {
  if (!t) return 0;
  return t.split('\n').reduce((n, p) => { let w = 0; for (const ch of p) w += /[\x20-\x7e｡-ﾟ]/.test(ch) ? 0.5 : 1; return n + Math.max(1, Math.ceil(w / ALT_COLS)); }, 0);
}

// アイコン：画像があれば画像、なければ頭文字（色は名前ごとに固定）
const AV = [['#d8effa', '#1677b0'], ['#dcf3ee', '#1a7f6b'], ['#e8e6fb', '#5146b0'], ['#fde9ef', '#b03a62'], ['#fdf1dc', '#a1620f'], ['#e6f2dc', '#4c7a1e']];
function avatar(c, cls = '') {
  if (c.images?.[0]) return `<span class="av ${cls}"><img src="${esc(c.images[0])}" alt=""></span>`;
  let h = 0; for (const ch of c.name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const [bg, fg] = AV[h % AV.length];
  return `<span class="av ${cls}" style="background:${bg};color:${fg}">${esc([...c.name][0] || '?')}</span>`;
}

// ===== 画面状態 =====
let tab = 'list', detail = null, dEdit = null, dDel = false, evDetail = null, evCopy = { copyUnit: null }, q = '', tagF = '', stF = '', sortKey = 'recent', sortDesc = true;
const blankEd = () => ({ query: '', picked: null, newMode: false, kind: null, count: 1, tags: [], note: '', showTags: false });
const inp = { date: liveDate(), sid: null, ed: blankEd(), venueOpen: false, venueQuery: '', openSet: new Set(), confirmDel: false, step: null };
let confirmReset = false;

const app = document.getElementById('app');
const ttl = document.getElementById('ttl');
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => { if (b.dataset.tab === 'input' && inp.fromView) goInput(liveDate()); tab = b.dataset.tab; detail = null; evDetail = null; render(); window.scrollTo(0, 0); }));
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
const onAll = (sel, fn) => app.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));

let loginErr = '', loginBusy = false, fatal = '';
function showFatal(m) { fatal = m; render(); }
function render() {
  const nav = document.querySelector('nav'), gear = document.getElementById('gear');
  if (fatal) { nav.hidden = true; gear.hidden = true; ttl.textContent = 'ファンメモ'; app.innerHTML = `<div class="alert">${esc(fatal)}</div>`; return; }
  if (!FB || user === undefined) { nav.hidden = true; gear.hidden = true; ttl.textContent = 'ファンメモ'; app.innerHTML = '<div class="empty">読み込み中…</div>'; return; }
  if (!user) { nav.hidden = true; gear.hidden = true; return renderLogin(); }
  if (!ready) { nav.hidden = false; gear.hidden = false; ttl.textContent = 'ファンメモ'; app.innerHTML = '<div class="empty">データを読み込み中…</div>'; return; }
  nav.hidden = false; gear.hidden = false;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.getElementById('gear').classList.toggle('on', tab === 'settings');
  if (detail) return renderDetail();
  if (tab === 'events' && evDetail) return renderEventView();
  ({ list: renderList, input: renderInput, events: renderEvents, settings: renderSettings })[tab]();
}
document.getElementById('gear').addEventListener('click', () => { tab = 'settings'; detail = null; render(); window.scrollTo(0, 0); });

// ===== 一覧 =====
function renderList() {
  ttl.textContent = 'ファン';
  const nq = norm(q);
  const filtering = q || tagF || stF;
  const hideReg = !!db.settings.hideRegular;
  const nReg = db.customers.filter(c => c.regular).length;
  const rows = db.customers.map(c => ({ c, s: stats(c.id) }))
    .filter(({ c }) => !hideReg || !c.regular)
    .filter(({ c }) => !tagF || c.tags.includes(tagF))
    .filter(({ s }) => !stF || s.status === stF)
    .filter(({ c, s }) => !nq || norm(c.name + c.note + c.tags.join('') + s.dates.map(d => db.thanks[d + '|' + c.id] || '').join('')).includes(nq))
    .sort((a, b) => {
      if (!a.s.last || !b.s.last) return (a.s.last ? 0 : 1) - (b.s.last ? 0 : 1); // 記録のない人は常に最後
      let d = sortKey === 'count' ? a.s.count - b.s.count
        : sortKey === 'first' ? a.s.first.date.localeCompare(b.s.first.date) || a.s.first.at - b.s.first.at
        : a.s.last.date.localeCompare(b.s.last.date) || a.s.last.at - b.s.last.at;
      if (!d) d = a.s.last.date.localeCompare(b.s.last.date);
      return sortDesc ? -d : d;
    });
  const dirLabel = sortKey === 'count' ? (sortDesc ? '多い順 ↓' : '少ない順 ↑') : (sortDesc ? '新しい順 ↓' : '古い順 ↑');
  app.innerHTML = `
    <section class="card">
      <div class="sec-h"><h2>検索</h2>${filtering ? '<button class="link" id="clear">条件をクリア</button>' : ''}</div>
      <input class="search" id="q" type="search" placeholder="名前・特徴・お礼文で検索" value="${esc(q)}">
      <div class="filters">
        <label><span class="lbl">特徴</span><select class="sel" id="tagf"><option value="">すべて</option>${TAGS.map(t => `<option ${tagF === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
        <label><span class="lbl">最後のステータス</span><select class="sel" id="stf"><option value="">すべて</option>${STATUS_ORDER.map(k => `<option value="${k}" ${stF === k ? 'selected' : ''}>${KINDS[k].status}</option>`).join('')}</select></label>

  qi.addEventListener('input', upd); qi.addEventListener('compositionend', upd);

  on('stf', 'change', e => { stF = e.target.value; renderList(); });
  on('sortkey', 'change', e => { sortKey = e.target.value; renderList(); });
  on('sortdir', 'click', () => { sortDesc = !sortDesc; renderList(); });
  app.querySelectorAll('.row').forEach(r => {
    const open = () => { detail = r.dataset.id; dEdit = null; dDel = false; render(); window.scrollTo(0, 0); };
    r.addEventListener('click', open); r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });
  app.querySelectorAll('.regt').forEach(b => b.onclick = ev => { ev.stopPropagation(); const c = cust(b.dataset.id); c.regular = !c.regular; save(); renderList(); toast(c.regular ? `${c.name}さんを常連にしました` : `${c.name}さんを常連から外しました`); });
  on('hidereg', 'click', () => { db.settings.hideRegular = !hideReg; save(); renderList(); });
}

// ===== 詳細 =====
function renderDetail() {
  const c = cust(detail); if (!c) { detail = null; return render(); }
  const s = stats(c.id);
  ttl.textContent = c.name;
  let profile;
  if (dEdit) {
    const dup = dEdit.name.trim() && db.customers.find(x => x.id !== c.id && x.name === dEdit.name.trim());
    profile = `<div class="card">
      <div class="sec-h"><h2>編集</h2></div>
      <div class="frow"><span class="lbl">名前</span><input class="field sm" id="dname" value="${esc(dEdit.name)}"></div>
      ${dup ? `<div class="alert">「${esc(dup.name)}」はすでに登録されています。区別できる名前にしてください。</div>` : ''}
      <div class="frow top"><span class="lbl">特徴</span><div class="chips t4">${TAGS.map(t => `<button class="chip dtag ${dEdit.tags.includes(t) ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
      <div class="frow top"><span class="lbl">メモ</span><textarea class="field sm" id="dnote" rows="3">${esc(dEdit.note)}</textarea></div>

      <div class="hint">日ごとの記録（区分・枚数・お礼文）は、下の「この日を見る」からイベント画面を開き、ペンボタンで直せます。</div>
    </div>`;
  } else {
    profile = `<div class="card">
      <div class="prof">${avatar(c, 'face')}
        <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:4px"><h2>${esc(c.name)}</h2><div class="chips">${stBadge(s.status) || '<span class="hint">記録なし</span>'}${c.regular ? '<span class="st" style="background:#fdf3d6;color:#9a6b00">★ 常連</span>' : ''}</div></div>
        <div style="display:flex;gap:6px;align-self:flex-start"><button class="ibtn" id="dedit" aria-label="編集" title="編集">${ICON_PEN}</button><button class="ibtn del" id="ddel" aria-label="削除" title="削除">${ICON_TRASH}</button></div></div>
      ${dDel ? `<div class="alert">${esc(c.name)}さんと、これまでの記録（${s.dates.length}日分）・お礼文をすべて削除します。元に戻せません。</div>
        <div class="inline"><button class="danger" id="ddelok">削除する</button><button class="ghost" id="ddelno">やめる</button></div>` : ''}
      <div class="frow top flat"><span class="lbl">特徴</span><div class="chips">${c.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('') || '<span class="hint">なし</span>'}</div></div>
      <div class="frow top flat"><span class="lbl">メモ</span><div class="note">${c.note ? esc(c.note) : '<span class="hint">なし</span>'}</div></div>
    </div>`;
  }
  app.innerHTML = `
    <div><button class="back" id="back">‹ 戻る</button></div>
    ${profile}
    <div class="card"><span class="lbl">これまでの記録（${s.dates.length}日）</span>
      ${s.dates.map(d => {
        const labels = sessLabels(d);
        const es = s.es.filter(e => e.s.date === d).sort((a, b) => a.s.order - b.s.order);
        const th = db.thanks[d + '|' + c.id];
        return `<div class="visit">
          <div class="vh"><span>${d.replace(/-/g, '/')}</span><button class="link openday" data-d="${d}">この日を見る</button></div>
          ${es.map(e => `<div class="vl">${labels[e.sid] && labels[e.sid] !== EVENTS[e.s.event].label ? esc(labels[e.sid]) + ' ' : ''}${EVENTS[e.s.event].label}・${esc(e.s.venue)}：<b>${esc(kindText(e))}</b></div>`).join('')}
          ${th ? `<div class="dthanks"><span class="lbl">お礼文（${altLines(th)}行）</span><p>${esc(th)}</p></div>` : ''}
        </div>`;
      }).join('') || '<div class="hint">まだ記録がありません</div>'}
    </div>`;
  on('back', 'click', () => { detail = null; dEdit = null; render(); });
  on('ddel', 'click', () => { dDel = true; renderDetail(); });
  on('ddelno', 'click', () => { dDel = false; renderDetail(); });
  on('ddelok', 'click', () => {
    db.entries = db.entries.filter(e => e.cid !== c.id);
    Object.keys(db.thanks).forEach(k => { if (k.endsWith('|' + c.id)) delete db.thanks[k]; });
    db.customers = db.customers.filter(x => x.id !== c.id);
    save(); detail = null; dDel = false; render(); toast(`${c.name}さんを削除しました`);
  });
  on('dedit', 'click', () => { dDel = false; dEdit = { name: c.name, tags: [...c.tags], note: c.note || '' }; renderDetail(); });
  ['input', 'compositionend'].forEach(t => on('dname', t, e => {
    dEdit.name = e.target.value; if (e.isComposing) return;
    const pos = e.target.selectionStart; renderDetail(); const n = document.getElementById('dname'); n.focus(); n.setSelectionRange(pos, pos);
  }));
  onAll('.dtag', b => { const t = b.dataset.t; dEdit.tags = dEdit.tags.includes(t) ? dEdit.tags.filter(x => x !== t) : [...dEdit.tags, t]; renderDetail(); });
  on('dnote', 'input', e => dEdit.note = e.target.value);
  on('dcancel', 'click', () => { dEdit = null; renderDetail(); });
  on('dsave', 'click', () => { c.name = dEdit.name.trim(); c.tags = dEdit.tags; c.note = dEdit.note.trim(); dEdit = null; save(); renderDetail(); toast('保存しました'); });
  onAll('.openday', b => { tab = 'events'; evDetail = b.dataset.d; evCopy.copyUnit = null; detail = null; render(); window.scrollTo(0, 0); });
}
function goInput(date) { tab = 'input'; detail = null; Object.assign(inp, { date, sid: null, ed: blankEd(), venueOpen: false, openSet: new Set(), copyUnit: null, confirmDel: false, fromView: false, step: null }); }

// ===== イベント一覧 =====
const entryText = e => KINDS[e.kind].count ? (CHEKI_KINDS.includes(e.kind) ? `${e.count}枚` : `${KINDS[e.kind].label} ${e.count}${KINDS[e.kind].unit}`) : KINDS[e.kind].status;
function sessPeople(sid) {
  return db.entries.filter(e => e.sid === sid)
    .sort((a, b) => (KINDS[b.kind].rank - KINDS[a.kind].rank) || (b.count - a.count) || a.at - b.at);
}
function eventDates() { return [...new Set(db.sessions.filter(s => db.entries.some(e => e.sid === s.id)).map(s => s.date))].sort().reverse(); }
function renderEvents() {

        <button class="evh" data-d="${d}"><span class="evd">${fmtW(d)}</span>
          <span class="evt-t">${one ? `${esc(ss[0].venue)}<small>${EVENTS[ss[0].event].label}</small>` : `<small>${ss.length}公演</small>`}</span><span class="chev">›</span></button>
        ${ss.map(s => `<div class="evs">
          ${one ? '' : `<div class="evs-h">${labels[s.id] && labels[s.id] !== EVENTS[s.event].label ? `<b>${esc(labels[s.id])}</b>` : ''}${esc(s.venue)}<small>${EVENTS[s.event].label}</small></div>`}
          ${sessPeople(s.id).map(e => { const c = cust(e.cid); return `<button class="evp" data-cid="${c.id}"><span class="dot"></span><span class="n">${esc(c.name)}</span><span class="v">${esc(entryText(e))}</span></button>`; }).join('')}
        </div>`).join('')}
      </section>`;
    }).join('') || '<div class="empty">まだイベントの記録がありません。下の「＋入力」から記録しましょう</div>'}`;
  onAll('.evh', b => { evDetail = b.dataset.d; evCopy.copyUnit = null; render(); window.scrollTo(0, 0); });
  onAll('.evp', b => { detail = b.dataset.cid; dEdit = null; dDel = false; render(); window.scrollTo(0, 0); });
}

        <div class="ents">${ps.map(e => { const c = cust(e.cid); return `
          <div class="ent"><button class="nmb evp" data-cid="${c.id}">${avatar(c, 'sm')}<b>${esc(c.name)}</b></button><span class="k">${esc(kindText(e))}</span></div>`; }).join('') || '<div class="hint" style="padding:8px 0">まだ誰もいません</div>'}</div>
      </div>`;

        ${g.people.map(p => { const c = cust(p.cid), t = (db.thanks[d + '|' + p.cid] || '').trim(); return `

  on('evback', 'click', () => { evDetail = null; render(); window.scrollTo(0, 0); });

  bindCopy(d);

// ===== 入力 =====
function cleanup() { // 誰も追加されず枚数も空の公演は消す（今開いているものは残す）
  const used = new Set(db.entries.map(e => e.sid));
  db.sessions = db.sessions.filter(s => used.has(s.id) || s.total || s.id === inp.sid);
}
function lastVenue() { return [...db.sessions].filter(s => s.venue).sort((a, b) => b.date.localeCompare(a.date) || b.order - a.order)[0]?.venue || ''; }
function curSession() {
  let ss = daySessions(inp.date);
  if (!ss.length) { const s = { id: uid(), date: inp.date, event: 'tokuten', venue: lastVenue(), total: 0, order: 0 }; db.sessions.push(s); ss = [s]; }
  if (!ss.find(s => s.id === inp.sid)) inp.sid = ss[0].id;
  return sess(inp.sid);
}
function pick(cid) {
  const s = curSession(), c = cust(cid);
  const e = db.entries.find(x => x.sid === s.id && x.cid === cid);
  inp.ed = { query: '', picked: cid, newMode: false, kind: e ? e.kind : EVENTS[s.event].kinds[0], count: e?.count || 1, tags: [...c.tags], note: c.note || '' };
}

function renderInput() {
  ttl.textContent = '記録する';
  cleanup();
  const s = curSession(), ev = EVENTS[s.event], ed = inp.ed;
  const ss = daySessions(inp.date), labels = sessLabels(inp.date);
  const today = liveDate();

  // 会場：よく使う5つ＋選択中をタグ表示、残りは「その他」から検索
  const vs = venueStats();
  const top = [...vs].sort((a, b) => b.count - a.count || b.last.localeCompare(a.last)).slice(0, 5);
  const chipVenues = !s.venue || top.some(v => v.name === s.venue) ? top : [...top, vs.find(v => v.name === s.venue)].filter(Boolean);
  const nvq = norm(inp.venueQuery);
  const otherVenues = [...vs].sort((a, b) => b.last.localeCompare(a.last)).filter(v => !nvq || norm(v.name).includes(nvq));

  // この公演に来た人
  const ents = db.entries.filter(e => e.sid === s.id).sort((a, b) => b.at - a.at);
  const entered = ents.filter(e => CHEKI_KINDS.includes(e.kind)).reduce((n, e) => n + e.count, 0);

  // 名前入力・候補
  const nq = norm(ed.query);
  const matches = nq ? db.customers.filter(c => norm(c.name).includes(nq) || nq.includes(norm(c.name))).slice(0, 6) : [];
  const exact = db.customers.find(c => c.name === ed.query.trim());
  const picked = ed.picked && cust(ed.picked);
  const editing = picked || ed.newMode;
  const already = picked && ents.find(e => e.cid === picked.id);

  let nameUI;
  if (editing) nameUI = '';
  else nameUI = `<div class="fcol">
      <input class="field" id="who" value="${esc(ed.query)}" placeholder="名前を入力（ひらがな・カタカナOK）" autocomplete="off">
      ${matches.length ? `<div class="sugg">${matches.map(c => sugBtn(c, ents)).join('')}</div>` : ''}
      ${ed.query.trim() ? `<button class="newbtn" id="gonew">「${esc(ed.query.trim())}」を新規登録</button>` : ''}
    </div>`;

  let editor = '';
  if (editing) {
    const st = picked ? stats(picked.id) : null;
    const canAdd = picked || (ed.query.trim() && !exact);
    editor = `<div class="editor">
      ${picked
        ? `<div class="who">${avatar(picked, 'sm')}<b>${esc(picked.name)}</b><small class="hint">${st.last ? '前回 ' + fmt(st.last.date) : '初めて'}</small></div>`
        : `<div class="frow"><span class="lbl">名前</span><input class="field sm" id="nname" value="${esc(ed.query)}" placeholder="呼び名"></div>
           ${exact ? `<div class="alert">「${esc(exact.name)}」はすでに登録されています。別の人なら「${esc(exact.name)}（メガネ）」のように区別できる名前にしてください。</div>` : ''}
           ${!exact && matches.length ? `<div class="alert">登録済みの人ではありませんか？</div><div class="sugg">${matches.map(c => sugBtn(c, ents)).join('')}</div>` : ''}`}
      ${ev.kinds.length > 1 ? `<div class="frow"><span class="lbl">区分</span><div class="seg">${ev.kinds.map(k => `<button class="ekind ${ed.kind === k ? 'on' : ''}" data-k="${k}">${KINDS[k].label}</button>`).join('')}</div></div>` : ''}
      ${KINDS[ed.kind].count ? `<div class="frow"><span class="lbl">${KINDS[ed.kind].unit === '枚' ? '枚数' : '部数'}</span>${stepper('ecount', ed.count, KINDS[ed.kind].unit)}</div>` : ''}
      ${ed.showTags ? `
        <div class="frow top"><span class="lbl">特徴</span><div class="chips t4">${TAGS.map(t => `<button class="chip etag ${ed.tags.includes(t) ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
        <div class="frow"><span class="lbl">メモ</span><input class="field sm" id="enote" value="${esc(ed.note)}" placeholder="特徴メモ"></div>`
        : `<button class="tagtoggle" id="showtags"><span>特徴を編集</span><span class="tg-sum">${esc([...ed.tags, ed.note.split('\n')[0]].filter(Boolean).join('・')) || 'なし'}</span><span>›</span></button>`}
      <div class="inline"><button class="primary" id="commit" style="flex:1" ${canAdd ? '' : 'disabled'}>${already ? '更新' : '追加'}</button><button class="ghost" id="cancel">やめる</button></div>
    </div>`;
  }

  // ステップ（①公演 ②ファン ③お礼文）
  const tgroups = thanksData(ss, labels), tpeople = tgroups.flatMap(g => g.people);
  const todo = tpeople.filter(p => !(db.thanks[inp.date + '|' + p.cid] || '').trim()).length;
  const dayHasEntries = db.entries.some(e => ss.some(x => x.id === e.sid));
  if (!inp.step) inp.step = dayHasEntries ? 'fans' : 'event';
  if (inp.step === 'thanks' && !tpeople.length) inp.step = 'fans';
  const step = inp.step;
  const sample = db.sample && !dayHasEntries && inp.date === today;
  const sessName = x => (labels[x.id] && labels[x.id] !== EVENTS[x.event].label ? labels[x.id] + ' ' : '') + EVENTS[x.event].short;
  const mismatch = ev.total && s.total && ents.length && s.total !== entered;
  const evDone = !!s.venue && (!ev.total || s.total > 0);

  const steps = `<div class="steps">
    <button class="stp ${step === 'event' ? 'on' : ''}" data-step="event"><span class="no">1</span><span class="tt">公演</span><small class="${evDone ? 'ok' : ''}">${evDone ? '✓' : '未設定'}</small></button>
    <button class="stp ${step === 'fans' ? 'on' : ''}" data-step="fans"><span class="no">2</span><span class="tt">ファン</span><small class="${mismatch ? 'ng' : ''}">${ents.length}人${mismatch ? '・ずれ' : ''}</small></button>
    <button class="stp ${step === 'thanks' ? 'on' : ''}" data-step="thanks" ${tpeople.length ? '' : 'disabled'}><span class="no">3</span><span class="tt">お礼文</span><small id="steptodo" class="${tpeople.length && !todo ? 'ok' : todo ? 'ng' : ''}">${!tpeople.length ? '—' : todo ? `未記入${todo}` : '完了'}</small></button>
  </div>`;
  const summary = step === 'thanks'
    ? `<button class="sumbar" id="toevent"><span>${fmtW(inp.date)}</span><span class="sv">${ss.length > 1 ? ss.map(x => sessName(x)).join(' ／ ') : esc(s.venue || '会場未設定')}</span><span class="pen">✎</span></button>`

    </div>
    <div class="card">
      <div class="frow"><span class="lbl">イベント</span><div class="seg ev">${Object.keys(EVENTS).map(k => `<button class="evt ${s.event === k ? 'on' : ''}" data-k="${k}">${EVENTS[k].label}</button>`).join('')}</div></div>
      <div class="frow top"><span class="lbl">${ev.place}</span><div class="fcol">
        <div class="chips" id="vchips">${chipVenues.map(v => `<button class="chip ven ${s.venue === v.name ? 'on' : ''}" data-v="${esc(v.name)}">${esc(v.name)}</button>`).join('')}
          <button class="chip" id="venmore">${inp.venueOpen ? '閉じる' : 'その他…'}</button></div>
        ${inp.venueOpen ? `
          <input class="field sm" id="vq" value="${esc(inp.venueQuery)}" placeholder="${ev.place}名で探す・追加" autocomplete="off">
          <div class="vlist">${otherVenues.map(v => `<button class="ven ${s.venue === v.name ? 'on' : ''}" data-v="${esc(v.name)}"><span>${esc(v.name)}</span><small class="hint">${v.count}回</small></button>`).join('') || `<div class="hint" style="padding:10px 12px">見つかりません</div>`}</div>
          ${inp.venueQuery.trim() && !vs.find(v => v.name === inp.venueQuery.trim()) ? `<button class="newbtn" id="vadd">「${esc(inp.venueQuery.trim())}」を追加</button>` : ''}` : ''}
      </div></div>
      ${ev.total ? `<div class="frow"><span class="lbl">チェキ<br>合計</span>${stepper('total', s.total, '枚')}</div>` : ''}
      ${ss.length > 1 || ents.length ? (inp.confirmDel
        ? `<div class="alert">この公演と${ents.length}人分の記録を消します。元に戻せません。</div><div class="inline"><button class="danger" id="delsess">消す</button><button class="ghost" id="nodel">やめる</button></div>`
        : `<button class="link" id="askdel" style="align-self:flex-end;color:var(--mute)">この公演を削除</button>`) : ''}

  else if (step === 'fans') body = `
    ${summary}${sessTabs}
    <div class="card">
      <div class="sec-h"><h2>${s.event === 'street' ? 'ビラ' : 'ファン'}</h2><small>${ents.length}人</small></div>

      ${ents.length ? `<div class="ents">${ents.map(e => { const c = cust(e.cid); return `
        <div class="ent"><button class="nmb" data-cid="${c.id}">${avatar(c, 'sm')}<b>${esc(c.name)}</b></button>
          <span class="k">${esc(kindText(e))}</span><button class="x rm" data-id="${e.id}" aria-label="${esc(c.name)}を外す">×</button></div>`; }).join('')}</div>` : ''}
    </div>
    ${tpeople.length ? `<button class="primary" id="gothanks">お礼文へ ›</button>` : ''}`;
  else body = `${summary}${renderThanks(ss, labels)}`;

  app.innerHTML = `
    ${inp.fromView ? `<div style="display:flex;justify-content:space-between;align-items:center"><button class="back" id="toview">‹ 閲覧に戻る</button><span class="hint">編集モード</span></div>` : ''}
    ${steps}
    ${body}`;

  onAll('.stp', b => { inp.step = b.dataset.step; inp.ed = blankEd(); renderInput(); window.scrollTo(0, 0); });
  on('toevent', 'click', () => { inp.step = 'event'; renderInput(); window.scrollTo(0, 0); });
  on('gofans', 'click', () => { inp.step = 'fans'; renderInput(); window.scrollTo(0, 0); document.getElementById('who')?.focus({ preventScroll: true }); });
  on('gothanks', 'click', () => { inp.step = 'thanks'; inp.ed = blankEd(); renderInput(); window.scrollTo(0, 0); });
  on('showtags', 'click', () => { inp.ed.showTags = true; renderInput(); });
  // --- イベント ---
  on('toview', 'click', () => { const d = inp.date; tab = 'events'; evDetail = daySessions(d).length ? d : null; evCopy.copyUnit = null; render(); window.scrollTo(0, 0); });
  on('date', 'change', e => { if (!e.target.value) return; goInput(e.target.value); inp.step = 'event'; renderInput(); });
  on('totoday', 'click', () => { goInput(today); inp.step = 'event'; renderInput(); });
  on('sampleday', 'click', () => { goInput(daysAgo(2)); renderInput(); });
  onAll('.stab', b => { Object.assign(inp, { sid: b.dataset.id, ed: blankEd(), venueOpen: false, confirmDel: false }); renderInput(); });
  on('addsess', 'click', () => {
    const n = { id: uid(), date: inp.date, event: s.event, venue: s.venue, total: 0, order: Math.max(...ss.map(x => x.order)) + 1 };
    db.sessions.push(n); Object.assign(inp, { sid: n.id, ed: blankEd(), confirmDel: false }); save(); renderInput(); toast('公演を追加しました');
  });
  onAll('.evt', b => {
    const k = b.dataset.k; if (k === s.event) return;
    s.event = k;
    // 区分が合わなくなった人は、新しいイベントの最初の区分に揃える
    db.entries.filter(e => e.sid === s.id && !EVENTS[k].kinds.includes(e.kind)).forEach(e => { e.kind = EVENTS[k].kinds[0]; if (!KINDS[e.kind].count) e.count = 0; else e.count = e.count || 1; });
    if (!EVENTS[k].kinds.includes(inp.ed.kind)) inp.ed.kind = EVENTS[k].kinds[0];
    save(); renderInput();
  });
  onAll('.chip.ven', b => { s.venue = b.dataset.v; save(); renderInput(); });
  onAll('.vlist .ven', b => { s.venue = b.dataset.v; Object.assign(inp, { venueOpen: false, venueQuery: '' }); save(); renderInput(); });
  on('venmore', 'click', () => { inp.venueOpen = !inp.venueOpen; inp.venueQuery = ''; renderInput(); if (inp.venueOpen) document.getElementById('vq').focus(); });
  ['input', 'compositionend'].forEach(t => on('vq', t, e => { inp.venueQuery = e.target.value; keepFocus('vq', e); }));
  on('vadd', 'click', () => {
    const name = inp.venueQuery.trim(); if (!name) return;
    if (!db.venues.includes(name)) db.venues.push(name);
    s.venue = name; Object.assign(inp, { venueOpen: false, venueQuery: '' }); save(); renderInput();
  });
  bindStepper('total', v => { s.total = v; save(); const b = document.getElementById('bal'); if (b) b.outerHTML = balance(s.total, entered); });
  on('askdel', 'click', () => { inp.confirmDel = true; renderInput(); });
  on('nodel', 'click', () => { inp.confirmDel = false; renderInput(); });
  on('delsess', 'click', () => {
    db.entries = db.entries.filter(e => e.sid !== s.id); db.sessions = db.sessions.filter(x => x.id !== s.id);
    Object.assign(inp, { sid: null, confirmDel: false, ed: blankEd() }); save(); renderInput(); toast('公演を削除しました');
  });

  ['input', 'compositionend'].forEach(t => {
    on('who', t, e => { inp.ed.query = e.target.value; keepFocus('who', e); });
    on('nname', t, e => { inp.ed.query = e.target.value; keepFocus('nname', e); });
  });
  onAll('.sug', b => { pick(b.dataset.id); renderInput(); });
  on('gonew', 'click', () => { Object.assign(inp.ed, { newMode: true, kind: ev.kinds[0], count: 1, tags: [], note: '', showTags: true }); renderInput(); });
  onAll('.ekind', b => { inp.ed.kind = b.dataset.k; renderInput(); });
  bindStepper('ecount', v => inp.ed.count = v, 1);
  onAll('.etag', b => { const t = b.dataset.t; inp.ed.tags = inp.ed.tags.includes(t) ? inp.ed.tags.filter(x => x !== t) : [...inp.ed.tags, t]; renderInput(); });
  on('enote', 'input', e => inp.ed.note = e.target.value);
  on('cancel', 'click', () => { inp.ed = blankEd(); renderInput(); });
  on('commit', 'click', commit);
  onAll('.nmb', b => { pick(b.dataset.cid); renderInput(); });
  onAll('.rm', b => {
    const e = db.entries.find(x => x.id === b.dataset.id); const c = cust(e.cid);
    db.entries = db.entries.filter(x => x !== e); save(); renderInput(); toast(`${c.name}さんを外しました`);
  });
  bindThanks();
  fitVenueChips();
}

function keepFocus(id, e) { if (e.isComposing) return; const pos = e.target.selectionStart; renderInput(); const n = document.getElementById(id); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
function sugBtn(c, ents) {
  const s = stats(c.id), here = ents.find(e => e.cid === c.id);
  return `<button class="sug" data-id="${c.id}"><span style="display:flex;align-items:center;gap:6px;min-width:0">${avatar(c, 'sm')}<b>${esc(c.name)}</b>${stBadge(s.status)}</span><small>${here ? '追加済み' : s.last ? fmt(s.last.date) : ''}</small></button>`;
}
function stepper(id, v, unit) {
  return `<div class="stepper"><button data-step="${id}" data-d="-1" aria-label="減らす">−</button><input id="${id}" type="number" inputmode="numeric" min="0" value="${v}"><button data-step="${id}" data-d="1" aria-label="増やす">＋</button><span>${unit}</span></div>`;
}
function bindStepper(id, set, min = 0) {
  const el = document.getElementById(id); if (!el) return;
  const apply = v => { v = Math.max(min, v | 0); el.value = v; set(v); };
  el.addEventListener('input', () => apply(+el.value));
  app.querySelectorAll(`[data-step="${id}"]`).forEach(b => b.onclick = () => apply(+el.value + +b.dataset.d));
}
function balance(total, entered) {
  if (!total) return `<div class="bal" id="bal"><span>チェキ合計を入れると過不足が出ます</span><span>入力済み <b>${entered}</b>枚</span></div>`;
  const d = total - entered;
  const msg = d === 0 ? 'ぴったり' : d > 0 ? `あと <b>${d}</b>枚` : `<b>${-d}</b>枚 多い`;
  return `<div class="bal ${d === 0 ? 'ok' : 'ng'}" id="bal"><span>${entered} / ${total}枚</span><span>${msg}</span></div>`;
}
function commit() {
  const s = curSession(), ed = inp.ed;
  let c;
  if (ed.picked) c = cust(ed.picked);
  else {
    const name = ed.query.trim(); if (!name || db.customers.some(x => x.name === name)) return;
    c = { id: uid(), name, tags: [], note: '', createdAt: Date.now() }; db.customers.push(c);
  }
  c.tags = [...ed.tags]; c.note = ed.note.trim();
  const cnt = KINDS[ed.kind].count ? Math.max(1, ed.count | 0) : 0;
  const e = db.entries.find(x => x.sid === s.id && x.cid === c.id);
  if (e) Object.assign(e, { kind: ed.kind, count: cnt });
  else db.entries.push({ id: uid(), sid: s.id, cid: c.id, kind: ed.kind, count: cnt, at: Date.now() });
  save(); inp.ed = blankEd(); renderInput(); toast(`${c.name}さん：${KINDS[ed.kind].label}${cnt ? ' ' + cnt + KINDS[ed.kind].unit : ''}`);
  document.getElementById('who')?.focus();
}

// ===== お礼文（日ごと・人ごと。2公演の日は来た公演の組み合わせで分ける） =====
function thanksData(ss, labels) {
  const th = ss.filter(s => EVENTS[s.event].thanks);
  const per = new Map();
  db.entries.filter(e => th.some(s => s.id === e.sid) && KINDS[e.kind].thanks).forEach(e => {
    if (!per.has(e.cid)) per.set(e.cid, { cid: e.cid, sids: new Set(), es: [] });
    const p = per.get(e.cid); p.sids.add(e.sid); p.es.push(e);
  });
  const groups = new Map();
  [...per.values()].forEach(p => {
    const key = th.filter(s => p.sids.has(s.id)).map(s => s.id).join(',');
    if (!groups.has(key)) groups.set(key, []);
    p.units = p.es.reduce((n, e) => n + (KINDS[e.kind].count ? e.count : 0), 0);
    p.summary = summarize(p.es);
    groups.get(key).push(p);
  });
  const order = [...groups.keys()].sort((a, b) => b.split(',').length - a.split(',').length || th.findIndex(s => s.id === a.split(',')[0]) - th.findIndex(s => s.id === b.split(',')[0]));
  return order.map(key => {
    const ids = key.split(',');
    let title = '', short = '';
    if (th.length > 1) {
      short = ids.length === th.length ? (th.length === 2 ? '両部' : '全公演') : ids.length === 1 ? `${labels[ids[0]]}のみ` : ids.map(id => labels[id]).join('・');
      title = (ids.length === 1 ? labels[ids[0]] : short) + '来てくれた人';
    }
    const ord = (db.orders || {})[ss[0]?.date] || [];
    const pos = cid => { const i = ord.indexOf(cid); return i < 0 ? Infinity : i; };
    return { key, title, short, people: groups.get(key).sort((a, b) => pos(a.cid) - pos(b.cid) || b.units - a.units) };
  });
}
function summarize(es) {
  const m = {}; es.forEach(e => m[e.kind] = (m[e.kind] || 0) + (KINDS[e.kind].count ? e.count : 1));
  return Object.entries(m).map(([k, n]) => KINDS[k].count ? `${KINDS[k].label}${n}${KINDS[k].unit}` : KINDS[k].label).join('・');
}
function renderThanks(ss, labels) {
  const groups = thanksData(ss, labels);
  const all = groups.flatMap(g => g.people);
  if (!all.length) return '';
  const todo = all.filter(p => !(db.thanks[inp.date + '|' + p.cid] || '').trim()).length;
  return `<div class="card">
    <div class="sec-h"><h2>お礼文</h2><small id="todocnt">${todo ? `未記入 ${todo}人` : 'すべて記入済み'}</small></div>
    <div class="hint">名前を長押しすると並べ替えできます</div>
    ${groups.map(g => `<div class="grp tgrp" data-g="${g.key}">${g.title ? `<div class="grp-h"><span>${esc(g.title)}</span><span>${g.people.length}人</span></div>` : ''}
      ${g.people.map(p => thanksItem(p)).join('')}</div>`).join('')}
    ${copyBlock(groups)}
  </div>`;
}
// まとめてコピー：単位ごとにお礼文をつなげ、1000文字を超えたら分ける
const ALT_LIMIT = 1000;
const clen = t => [...t].length;
function copyUnits(groups, date = inp.date) {
  const all = groups.flatMap(g => g.people);
  const units = [{ key: 'all', name: '全て', people: all }];
  if (groups.some(g => g.short)) groups.forEach(g => units.push({ key: g.key, name: g.short, people: g.people }));
  units.forEach(u => {
    u.texts = u.people.map(p => (db.thanks[date + '|' + p.cid] || '').trim()).filter(Boolean);
    u.parts = splitParts(u.texts);
  });
  return units;
}
function splitParts(texts) {
  const parts = []; let cur = '';
  for (let t of texts) {
    while (clen(t) > ALT_LIMIT) { // 1人分が1000文字を超える場合だけ途中で切る
      if (cur) { parts.push(cur); cur = ''; }
      const arr = [...t]; parts.push(arr.slice(0, ALT_LIMIT).join('')); t = arr.slice(ALT_LIMIT).join('');
    }
    const cand = cur ? cur + '\n\n' + t : t;
    if (clen(cand) > ALT_LIMIT) { parts.push(cur); cur = t; } else cur = cand;
  }
  if (cur) parts.push(cur);
  return parts;
}
function copyBlock(groups, date = inp.date) {
  const units = copyUnits(groups, date);
  const label = n => n === '全て' ? 'すべて' : n;
  return `<div class="grp copyblk" style="border-top:1px solid var(--sky-line);padding-top:12px">
    <span class="lbl">まとめてコピー（XのALT用）</span>
    ${units.map(u => {
      const total = u.parts.reduce((n, t) => n + clen(t), 0), off = !u.texts.length;
      const meta = `<span class="cmeta">${u.texts.length}人・${total.toLocaleString()}文字</span>`;
      if (u.parts.length <= 1) return `<div class="crow"><button class="ghost cbtn cp" data-k="${u.key}" data-i="0" ${off ? 'disabled' : ''}>${esc(label(u.name))}コピー</button>${meta}</div>`;
      return `<div class="crow multi"><div class="crow-h"><b>${esc(label(u.name))}</b>${meta}<span class="hint">1000文字を超えるため${u.parts.length}つに分割</span></div>
        <div class="crow-b">${u.parts.map((t, i) => `<button class="ghost cbtn cp" data-k="${u.key}" data-i="${i}">${i + 1}つ目をコピー<small>${clen(t)}文字</small></button>`).join('')}</div></div>`;
    }).join('')}
  </div>`;
}
function bindCopy(date) {
  const units = () => copyUnits(thanksData(daySessions(date), sessLabels(date)), date);
  onAll('.cp', b => {
    const u = units().find(x => x.key === b.dataset.k), i = +b.dataset.i;
    if (!u || !u.parts[i]) return;
    const name = u.name === '全て' ? 'すべて' : u.name;
    copyText(u.parts[i], u.parts.length > 1 ? `${name}の${i + 1}つ目をコピーしました` : `${name}をコピーしました`);
  });
}
function copyText(text, msg = 'コピーしました') {
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    t.remove(); toast(ok ? msg : 'コピーできませんでした');
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast(msg), fallback); else fallback();
}
const ALT_MAX_LINES = 12;
function thanksItem(p) {
  const c = cust(p.cid), key = inp.date + '|' + p.cid, text = db.thanks[key] || '';
  const lines = altLines(text);
  return `<div class="tcard" data-cid="${p.cid}">
    <div class="tc-h">${avatar(c, 'sm')}<b>${esc(c.name)}</b><small>${esc(p.summary)}</small>
      <span class="state ${text.trim() ? 'done' : 'todo'}">${text.trim() ? `${lines}行` : '未記入'}</span></div>
    <textarea class="alt" rows="6" placeholder="${esc(c.name)}さんへ（1行＝全角22文字）">${esc(text)}</textarea>
  </div>`;
}
function bindThanks() {
  bindCopy(inp.date);
  app.querySelectorAll('.tcard').forEach(card => {
    const key = inp.date + '|' + card.dataset.cid;
    const ta = card.querySelector('.alt'), st = card.querySelector('.state');
    let last = ta.value;
    const check = e => {
      if (e && e.isComposing) return;
      // 12行を超える入力は受け付けない
      const nl = altLines(ta.value);
      if (nl > ALT_MAX_LINES && nl > altLines(last)) { const pos = Math.max(0, ta.selectionStart - (ta.value.length - last.length)); ta.value = last; ta.setSelectionRange(pos, pos); toast(`お礼文は${ALT_MAX_LINES}行までです`); return; }
      last = ta.value; db.thanks[key] = ta.value; save();
      const n = altLines(ta.value);
      st.textContent = ta.value.trim() ? `${n}行` : '未記入'; st.className = 'state ' + (ta.value.trim() ? 'done' : 'todo');
      refreshThanksMeta();
    };
    ta.addEventListener('input', check); ta.addEventListener('compositionend', check);
  });
  bindSort();
}
// 入力したその場で、まとめてコピーと未記入数を更新する（画面全体は描き直さない）
function refreshThanksMeta() {
  const ss = daySessions(inp.date), groups = thanksData(ss, sessLabels(inp.date)), all = groups.flatMap(g => g.people);
  const todo = all.filter(p => !(db.thanks[inp.date + '|' + p.cid] || '').trim()).length;
  const tc = document.getElementById('todocnt'); if (tc) tc.textContent = todo ? `未記入 ${todo}人` : 'すべて記入済み';
  const sd = document.getElementById('steptodo'); if (sd) { sd.textContent = todo ? `未記入${todo}` : '完了'; sd.className = todo ? 'ng' : 'ok'; }
  const cb = app.querySelector('.copyblk');
  if (cb) { cb.outerHTML = copyBlock(groups); bindCopy(inp.date); }
}

// ===== お礼文の並べ替え：名前を長押し → 持ち上げて上下に動かす =====
function bindSort() {
  app.querySelectorAll('.tcard .tc-h').forEach(h => {
    let timer = null, sx = 0, sy = 0;
    const start = (x, y) => { sx = x; sy = y; clearTimeout(timer); timer = setTimeout(() => { timer = null; beginDrag(h.closest('.tcard'), y); }, 450); };
    const cancel = () => { clearTimeout(timer); timer = null; };
    h.addEventListener('touchstart', e => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    h.addEventListener('touchmove', e => { if (timer && Math.hypot(e.touches[0].clientX - sx, e.touches[0].clientY - sy) > 8) cancel(); }, { passive: true });
    h.addEventListener('touchend', cancel); h.addEventListener('touchcancel', cancel);
    h.addEventListener('mousedown', e => { if (e.button === 0) start(e.clientX, e.clientY); });
    h.addEventListener('mouseup', cancel); h.addEventListener('mouseleave', cancel);
    h.addEventListener('contextmenu', e => e.preventDefault());
  });
}
let drag = null;
function beginDrag(card, fingerY) {
  const grp = card.closest('.tgrp');
  document.activeElement?.blur?.();
  const wrap = card.closest('.card');
  wrap.classList.add('sorting'); card.classList.add('lifted');
  navigator.vibrate?.(15);
  // 入力欄をたたんだ後、持ち上げたカードが指の下に来るようにスクロールを合わせる
  const r = card.getBoundingClientRect();
  window.scrollBy(0, r.top + r.height / 2 - fingerY);
  drag = { card, grp, y: fingerY, raf: null };
  const move = y => {
    drag.y = y;
    const sibs = [...grp.querySelectorAll('.tcard')].filter(c => c !== card);
    let before = null;
    for (const c of sibs) { const b = c.getBoundingClientRect(); if (y < b.top + b.height / 2) { before = c; break; } }
    if (before) { if (card.nextElementSibling !== before) grp.insertBefore(card, before); }
    else { const last = sibs[sibs.length - 1]; if (last && last.nextElementSibling !== card) last.after(card); }
  };
  // 画面の端に近づいたら自動でスクロール
  const tick = () => {
    if (!drag) return;
    const edge = 90, vh = window.innerHeight;
    if (drag.y < edge) window.scrollBy(0, -Math.ceil((edge - drag.y) / 6));
    else if (drag.y > vh - edge - 70) window.scrollBy(0, Math.ceil((drag.y - (vh - edge - 70)) / 6));
    move(drag.y);
    drag.raf = requestAnimationFrame(tick);
  };
  const onTouch = e => { e.preventDefault(); move(e.touches[0].clientY); };
  const onMouse = e => move(e.clientY);
  const end = () => {
    cancelAnimationFrame(drag.raf);
    document.removeEventListener('touchmove', onTouch); document.removeEventListener('mousemove', onMouse);
    document.removeEventListener('touchend', end); document.removeEventListener('touchcancel', end); document.removeEventListener('mouseup', end);
    const order = [...app.querySelectorAll('.tgrp .tcard')].map(c => c.dataset.cid);
    db.orders = db.orders || {}; db.orders[inp.date] = order; save();
    const cid = card.dataset.cid; drag = null;
    renderInput();
    app.querySelector(`.tcard[data-cid="${cid}"]`)?.scrollIntoView({ block: 'center' });
  };
  document.addEventListener('touchmove', onTouch, { passive: false });
  document.addEventListener('mousemove', onMouse);
  document.addEventListener('touchend', end); document.addEventListener('touchcancel', end); document.addEventListener('mouseup', end);
  drag.raf = requestAnimationFrame(tick);
}

// 会場タグを最大2行に収める（はみ出す分は「その他」から選べる）
function fitVenueChips() {
  const box = document.getElementById('vchips'); if (!box) return;
  const items = [...box.children];
  items.forEach(el => el.hidden = false);
  const rows = () => new Set(items.filter(el => !el.hidden).map(el => el.offsetTop)).size;
  while (rows() > 2) {
    const victim = items.filter(el => !el.hidden && el.classList.contains('ven') && !el.classList.contains('on')).pop();
    if (!victim) break;
    victim.hidden = true;
  }
}
window.addEventListener('resize', fitVenueChips);
document.fonts?.ready.then(fitVenueChips);

// ===== ログイン =====
function renderLogin() {
  ttl.textContent = 'ファンメモ';
  app.innerHTML = `<form class="login card" id="loginf">
    <h2>ファンメモ</h2>
    <label class="fcol"><span class="lbl">メールアドレス</span><input class="field" id="lmail" type="email" autocomplete="username" inputmode="email" required></label>
    <label class="fcol"><span class="lbl">パスワード</span><input class="field" id="lpass" type="password" autocomplete="current-password" required></label>
    ${loginErr ? `<div class="err">${esc(loginErr)}</div>` : ''}
    <button class="primary" id="lbtn" ${loginBusy ? 'disabled' : ''}>${loginBusy ? 'ログイン中…' : 'ログイン'}</button>
    <button type="button" class="link" id="lforgot" style="align-self:center">パスワードを忘れたとき</button>
  </form>`;
  const f = document.getElementById('loginf');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const mail = document.getElementById('lmail').value.trim(), pass = document.getElementById('lpass').value;
    loginBusy = true; loginErr = ''; renderLogin(); document.getElementById('lmail').value = mail;
    try { await FB.signIn(mail, pass); }
    catch (err) { loginBusy = false; loginErr = authMessage(err); renderLogin(); document.getElementById('lmail').value = mail; }
  });
  on('lforgot', 'click', async () => {
    const mail = document.getElementById('lmail').value.trim();
    if (!mail) { loginErr = 'メールアドレスを入れてから押してください'; renderLogin(); return; }
    try { await FB.resetPassword(mail); toast('再設定メールを送りました'); } catch (err) { loginErr = authMessage(err); renderLogin(); document.getElementById('lmail').value = mail; }
  });
}
function authMessage(err) {
  const c = err?.code || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'メールアドレスかパスワードが違います';
  if (/too-many-requests/.test(c)) return '何度も失敗したため、しばらく待ってからお試しください';
  if (/network-request-failed/.test(c)) return '通信できません。電波のある場所でお試しください';
  return 'ログインできませんでした（' + c + '）';
}

window.appStart = api => {
  FB = api; updateNet();
  FB.onAuth(u => {
    if (u && user && u.uid === user.uid) return;
    if (user) stopSync();
    user = u || null; loginBusy = false; loginErr = '';
    tab = 'list'; detail = null; evDetail = null; goInput(liveDate()); tab = 'list';
    if (user) startSync();
    render();
  });
};
window.appFail = msg => showFatal(msg);
render();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn(e)));

<script type="module">
// Firebase SDK（ビルド不要でCDNから読み込み）
const V = '10.14.1';
try {
  const [{ initializeApp }, A, F, cfg] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    import('./firebase-config.js'),
  ]);
  if (!cfg.firebaseConfig?.apiKey || cfg.firebaseConfig.apiKey.startsWith('ここに')) throw new Error('firebase-config.js に接続情報が入っていません。');
  const app = initializeApp(cfg.firebaseConfig);
  const auth = A.getAuth(app);
  const fs = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  window.appStart({
    onAuth: cb => A.onAuthStateChanged(auth, cb),
    signIn: (m, p) => A.signInWithEmailAndPassword(auth, m, p),
    signOut: () => A.signOut(auth),
    resetPassword: m => A.sendPasswordResetEmail(auth, m),
    listen: (uid, col, next, error) => F.onSnapshot(F.collection(fs, 'users', uid, col), next, error),
    commit: (uid, ops) => {
      const b = F.writeBatch(fs);
      ops.forEach(([op, col, id, v]) => { const r = F.doc(fs, 'users', uid, col, id); op === 'set' ? b.set(r, v) : b.delete(r); });
      return b.commit();
    },
  });
} catch (e) {
  console.error(e);
  window.appFail(navigator.onLine ? '起動できませんでした：' + (e.message || e) : '初回の起動には通信が必要です。電波のある場所で開いてください。');
}
</script>
